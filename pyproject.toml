[project]
name = "sysu-check-in"
version = "0.1.0"
description = "Command-line client for SYSU check-in activities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sysu", "check-in", "face-check-in", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
authors = [
    { name = "Xiao Li", email = "xiaoli3397@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
    "pycryptodome>=3.23.0",
    "rich>=14.0",
]

[project.scripts]
sysu-check-in = "sysu_check_in.cli:main"

[project.urls]
Homepage = "https://github.com/undefined443/sysu-check-in"
Issues = "https://github.com/undefined443/sysu-check-in/issues"
Repository = "https://github.com/undefined443/sysu-check-in"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.11",
    "twine>=7.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
